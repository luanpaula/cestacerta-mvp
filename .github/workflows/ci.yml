name: CI - CestaCerta MVP
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install django pytest pytest-django pytest-cov
      - run: pytest cestacerta/tests.py -v --cov=cestacerta --cov-report=term-missing
